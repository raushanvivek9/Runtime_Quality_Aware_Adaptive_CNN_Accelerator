architecture:
  version: 0.3
  subtree:
  - name: systolic_array
    attributes:
      technology: 40nm
    local:
    - name: weights_glb
      class: smartbuffer_SRAM
      attributes:
        memory_width: 32
        n_banks: 1
        bank_depth: 65536
        n_buffets: 1
        memory_depth: bank_depth * n_banks
    - name: ifmap_glb
      class: smartbuffer_SRAM
      attributes:
        memory_width: 32
        n_banks: 1
        bank_depth: 65536
        n_buffets: 1
        memory_depth: bank_depth * n_banks
    - name: psum_glb
      class: smartbuffer_SRAM
      attributes:
        memory_width: 32
        n_banks: 1
        bank_depth: 65536
        n_buffets: 1
        memory_depth: bank_depth * n_banks
    - name: weights_dram
      class: custom_DRAM
      attributes:
        width: 32
    - name: ifmap_dram
      class: custom_DRAM
      attributes:
        width: 32
    - name: psum_dram
      class: custom_DRAM
      attributes:
        width: 32
    subtree:
    - name: PE[0..1023]
      attributes:
        memory_width: 16
      local:
      - name: mac
        class: custom_intmac
        attributes:
          datawidth: 8
      - name: ifmap_spad
        class: custom_regfile
        attributes:
          depth: 1
          n_rdwr_ports: 1
          width: 1
      - name: weights_spad
        class: custom_regfile
        attributes:
          depth: 1
          n_rdwr_ports: 1
          width: 1
      - name: psum_spad
        class: custom_regfile
        attributes:
          depth: 1
          n_rdwr_ports: 1
          width: 1
